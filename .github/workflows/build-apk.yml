name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Change "YOUR_SUBFOLDER_NAME" to the exact name of the folder where your files are sitting on GitHub!
    # For example, if your folder is named barryPSRproject, write: barryPSRproject
    defaults:
      run:
        working-directory: ./YOUR_SUBFOLDER_NAME

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 11 Runtime (Required for Cordova 12)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova Compiler globally
      run: npm install -g cordova

    - name: Restore Project Dependencies
      run: npm install

    - name: Add Android App Compilation Layer
      run: cordova platform add android --no-telemetry

    - name: Compile Debug APK Build
      run: cordova build android --debug --no-telemetry

    - name: Upload Finished APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: PSR_Engine_Debug_APK
        path: ${{ github.workspace }}/YOUR_SUBFOLDER_NAME/platforms/android/app/build/outputs/apk/debug/app-debug.apk
