name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 11 Runtime (Required for Cordova 12)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova Compiler globally
      run: npm install -g cordova

    - name: Restore Project Dependencies
      run: npm install

    - name: Add Android App Compilation Layer
      run: cordova platform add android --no-telemetry

    - name: Compile Debug APK Build
      run: cordova build android --debug --no-telemetry

    - name: Upload Finished APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: PSR_Engine_Debug_APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
