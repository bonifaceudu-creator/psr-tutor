<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria PSR Offline Search</title>
    <!-- We link to our styles file here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <!-- Animated Soft Dark Splash Screen Overlay Container -->
    <div id="appSplashScreen" class="splash-overlay dark-theme-splash">
        <div class="splash-branding-box">
            <!-- Enlarged master app branding icon -->
            <img src="icon-512.png" alt="Nigeria PSR Logo" class="splash-logo">
            
            <!-- Modern continuous loading spinner ring -->
            <div class="loading-ring-spinner"></div>
            
            <!-- Sequenced Text Animation Fields -->
            <div class="splash-animated-text-group">
                <h2 class="splash-main-title">Your PSR Tutor</h2>
                <p class="splash-credits-text">Designed by Engr Udu</p>
            </div>
        </div>
    </div>


    <!-- Header Section -->
    <header>
        <h1>Nigeria PSR</h1>
        <p>Public Service Rules (Offline Index)</p>
    </header>

    <!-- Search Section -->
        <!-- Search and Filtering Section -->
        <!-- Search and Filtering Section -->
    <main>
        <!-- Wrapper Container to lock all controls at the top -->
        <div class="sticky-header-wrapper">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by keyword or rule (e.g., 030402)..." 
                    oninput="performSearch()"
                >
            </div>

            <!-- Filter Subsystem -->
            <div class="quick-filters">
                <select id="chapterSelector" onchange="filterChapter()"></select>
                <!-- New toggle button for bookmarks -->
                <button id="bookmarkToggleBtn" onclick="toggleBookmarkFilter()" style="background-color: #fef3c7; color: #92400e;">⭐ Bookmarks</button>
                
                <button onclick="clearFilter()">Reset</button>
                
            </div>
        </div>

        <!-- Search Results Injection Nodes (This scrolls underneath smoothly) -->
        <div id="resultsCount" class="results-count"></div>
        <div id="searchResults" class="results-list"></div>
    </main>


<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("PSR Tutor offline service worker registered"))
            .catch(error => console.error("Service worker registration failed:", error));
    });
}
</script>
    <!-- We link our local database and logic at the bottom -->
    <script src="app.js"></script>
</body>
</html>
