<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria PSR Offline Search</title>
    <!-- Linked external stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Splash screen styling isolated from page body */
        #appSplashScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #1a1f2c;
        }
    </style>
</head>
<body>

    <!-- Animated Soft Dark Splash Screen Overlay Container -->
    <div id="appSplashScreen"
         class="splash-overlay"
         aria-label="Loading PSR Tutor"
         role="status">

        <div class="splash-branding-box">

            <div class="splash-logo-wrap">
                <img
                    src="icon-512.png"
                    alt="PSR Tutor"
                    class="splash-logo"
                >
            </div>

            <div class="splash-animated-text-group">

                <h2 class="splash-main-title">
                    Your PSR Tutor
                </h2>

                <p class="splash-subtitle">
                    Public Service Rules at your fingertips
                </p>

                <p class="splash-credits-text">
                    Designed by Engr Udu
                </p>

            </div>

            <div class="splash-progress" aria-hidden="true">
                <span></span>
            </div>

            <p class="splash-loading-text">
                Loading offline rules…
            </p>

        </div>
    </div>

    <!-- Header Section -->
    <header>
        <h1>Nigeria PSR</h1>
        <p>Public Service Rules (Offline Index)</p>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Sticky Header Container for Controls -->
        <div class="sticky-header-wrapper">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="performSearch()"
                    placeholder="Search by keyword or rule (e.g., 030402)...">
            </div>

            <!-- Filter Controls -->
            <div class="quick-filters">
                <select id="chapterSelector" onchange="filterChapter()"></select>
                <button id="bookmarkToggleBtn" onclick="toggleBookmarkFilter()" class="bookmark-filter-btn">⭐ Bookmarks</button>
                <button onclick="clearFilter()" class="reset-btn">Reset</button>
            </div>
        </div>

        <!-- Search Results Count and List Containers -->
        <div id="resultsCount" class="results-count"></div>
        <div id="resultsContainer" class="results-list"></div>
    </main>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("PSR Tutor offline service worker registered"))
            .catch(error => console.error("Service worker registration failed:", error));
    });
}
</script>

<!-- Cordova native bridge -->
<script src="cordova.js"></script>

<!-- PSR Tutor application logic -->
<script src="app.js"></script>

</body>
</html>
