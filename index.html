<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria PSR Offline Search</title>
    <!-- We link to our styles file here -->
    <link rel="stylesheet" href="style.css">
    <style>
    /* Critical startup background.
       This is intentionally inline so the screen
       is dark BEFORE style.css finishes loading. */

    html {
    margin: 0;
    padding: 0;
    background: #1a1f2c;
}

body {
    margin: 0;
    padding: 0;
}

    #appSplashScreen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #1a1f2c;
    }
</style>
</head>
<body>
    
            <!-- Animated Soft Dark Splash Screen Overlay Container -->
    <!-- PSR TUTOR IN-APP SPLASH -->
<div id="appSplashScreen"
     class="splash-overlay"
     aria-label="Loading PSR Tutor"
     role="status">

    <div class="splash-branding-box">

        <div class="splash-logo-wrap">
            <img
                src="icon-512.png"
                alt="PSR Tutor"
                class="splash-logo"
            >
        </div>

        <div class="splash-animated-text-group">

            <h2 class="splash-main-title">
                Your PSR Tutor
            </h2>

            <p class="splash-subtitle">
                Public Service Rules at your fingertips
            </p>

            <p class="splash-credits-text">
                Designed by Engr Udu
            </p>

        </div>

        <div class="splash-progress" aria-hidden="true">
            <span></span>
        </div>

        <p class="splash-loading-text">
            Loading offline rules…
        </p>

    </div>
</div>



    <!-- Header Section -->
    <header>
        <h1>Nigeria PSR</h1>
        <p>Public Service Rules (Offline Index)</p>
    </header>

    <!-- Search Section -->
        <!-- Search and Filtering Section -->
        <!-- Search and Filtering Section -->
    <main>
        <!-- Wrapper Container to lock all controls at the top -->
        <div class="sticky-header-wrapper">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by keyword or rule (e.g., 030402)..." 
                    oninput="performSearch()"
                >
            </div>

            <!-- Filter Subsystem -->
            <div class="quick-filters">
                <select id="chapterSelector" onchange="filterChapter()"></select>
                <!-- New toggle button for bookmarks -->
                <button id="bookmarkToggleBtn" onclick="toggleBookmarkFilter()" style="background-color: #fef3c7; color: #92400e;">⭐ Bookmarks</button>
                
                <button onclick="clearFilter()">Reset</button>
                
            </div>
        </div>

        <!-- Search Results Injection Nodes (This scrolls underneath smoothly) -->
        <div id="resultsCount" class="results-count"></div>
        <div id="searchResults" class="results-list"></div>
    </main>


<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("PSR Tutor offline service worker registered"))
            .catch(error => console.error("Service worker registration failed:", error));
    });
}
</script>

<!-- Cordova native bridge -->
<script src="cordova.js"></script>

<!-- PSR Tutor application logic -->
<script src="app.js"></script>

</body>
</html>
</body>
</html>
